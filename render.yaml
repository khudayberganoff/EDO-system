databases:
  - name: edo-db
    plan: free
    region: frankfurt
    databaseName: edo
    user: edo

services:
  - type: web
    name: edo-system
    # Docker - chunki PDF yaratish uchun LibreOffice kerak (Word shabloni
    # o'z formatida PDF ga aylantiriladi).
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: edo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Xizmatning haqiqiy manzili (Render o'zi to'ldiradi) - QR kodlar shu manzilga
      # ishora qiladi va CORS uchun ham ishlatiladi.
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: edo-system
          envVarKey: RENDER_EXTERNAL_URL

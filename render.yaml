databases:
  - name: edo-db
    plan: free
    databaseName: edo
    user: edo

services:
  - type: web
    name: edo-system
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: edo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        value: https://edo-system.onrender.com
